{% extends "base.html" %}
{% block content %}
<h3>Cause List</h3>
{% if error %}
  <p class="error">{{ error }}</p>
{% endif %}
{% if items and items|length > 0 %}
  <ul>
    {% for it in items %}
      <li><a href="{{ it.url }}" target="_blank">{{ it.title }}</a></li>
    {% endfor %}
  </ul>
{% else %}
  <p>No cause list items found for the given inputs.</p>
{% endif %}
{% endblock %}
